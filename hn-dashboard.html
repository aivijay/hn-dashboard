<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker News Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
    .header { background: #16213e; padding: 20px; border-bottom: 2px solid #0f3460; position: sticky; top: 0; z-index: 100; }
    .header h1 { color: #ff6b6b; font-size: 1.5rem; }
    .header .subtitle { color: #888; font-size: 0.85rem; margin-top: 5px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: #0f3460; border: none; border-radius: 6px; color: #888; cursor: pointer; font-size: 1rem; font-weight: bold; }
    .tab.active { background: #4ecdc4; color: #1a1a2e; }
    .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
    .controls select { padding: 8px; background: #16213e; color: #fff; border: 1px solid #0f3460; border-radius: 6px; }
    .controls button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .refresh-btn { background: #4ecdc4; color: #1a1a2e; }
    .date-label { color: #888; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; }
    .stat-card { background: #16213e; padding: 15px; border-radius: 8px; border: 1px solid #0f3460; flex: 1; }
    .stat-card .value { font-size: 1.8rem; font-weight: bold; color: #4ecdc4; }
    .stat-card .label { font-size: 0.8rem; color: #888; }
    .category-stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .category-card { background: #0f3460; padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .category-card:hover { background: #16213e; border: 1px solid #4ecdc4; }
    .category-card.active { background: #4ecdc4; }
    .category-card.active .cat-count, .category-card.active .cat-name { color: #1a1a2e; }
    .category-card .cat-icon { font-size: 1.5rem; }
    .category-card .cat-count { font-size: 1.4rem; font-weight: bold; color: #4ecdc4; }
    .category-card .cat-name { font-size: 0.85rem; color: #aaa; }
    .job-category { display: inline-block; background: #0f3460; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: #4ecdc4; margin-left: 10px; }
    .chart-container { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .chart-title { font-size: 0.9rem; color: #888; margin-bottom: 15px; }
    .chart { display: flex; align-items: flex-end; gap: 10px; height: 80px; }
    .chart-bar { flex: 1; background: #4ecdc4; border-radius: 4px 4px 0 0; min-height: 10px; }
    .chart-labels { display: flex; gap: 10px; margin-top: 8px; }
    .chart-labels span { flex: 1; text-align: center; font-size: 0.7rem; color: #666; }
    .story { background: #16213e; border-radius: 8px; padding: 15px; margin-bottom: 12px; border: 1px solid #0f3460; }
    .story-header { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
    .rank { font-size: 1.2rem; font-weight: bold; color: #ff6b6b; }
    .score { background: #0f3460; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; color: #4ecdc4; }
    .title { font-size: 1.1rem; color: #fff; text-decoration: none; display: block; margin: 8px 0; }
    .title:hover { color: #4ecdc4; }
    .meta { font-size: 0.8rem; color: #888; }
    .domain { color: #666; }
    .comments-link { color: #4ecdc4; text-decoration: none; margin-left: 10px; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .no-data { text-align: center; padding: 40px; color: #888; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 Hacker News Dashboard</h1>
    <div class="subtitle">Top 50 stories or latest jobs</div>
  </div>
  <div class="container">
    <div class="tabs">
      <button class="tab active" id="tab-stories" onclick="switchTab('stories')">📰 Top Stories</button>
      <button class="tab" id="tab-jobs" onclick="switchTab('jobs')">💼 Remote Jobs</button>
    </div>
    
    <div class="controls" id="stories-controls">
      <span class="date-label">📅 View:</span>
      <select id="dateSelect" onchange="loadStories()"></select>
      <button class="refresh-btn" onclick="loadStories()">🔄 Refresh</button>
      <button class="refresh-btn" onclick="saveToday()" style="background:#ff6b6b">💾 Save Today</button>
    </div>
    
    <div class="controls hidden" id="jobs-controls">
      <button class="refresh-btn" onclick="loadJobs()">🔄 Refresh Jobs</button>
    </div>
    
    <div class="stats" id="stories-stats">
      <div class="stat-card"><div class="value" id="totalStories">50</div><div class="label">Total Stories</div></div>
      <div class="stat-card"><div class="value" id="totalScore">-</div><div class="label">Total Points</div></div>
      <div class="stat-card"><div class="value" id="totalComments">-</div><div class="label">Total Comments</div></div>
    </div>
    
    <div class="stats hidden" id="jobs-stats">
      <div class="stat-card"><div class="value" id="totalJobs">-</div><div class="label">Total Jobs</div></div>
    </div>
    
    <div class="category-stats hidden" id="job-categories"></div>
    <div class="chart-container hidden" id="job-chart">
      <div class="chart-title">📈 Jobs per day (last 7 days)</div>
      <div class="chart" id="chart-bars"></div>
      <div class="chart-labels" id="chart-labels"></div>
    </div>
    
    <div id="stories"></div>
    <div id="jobs" class="hidden"></div>
  </div>
  
  <script>
    var stories = [], jobs = [], currentTab = 'stories', activeCategory = null;
    
    var CATEGORIES = [
      {name:'AI/ML',icon:'🤖',k:['ai','ml','machine learning','deep learning','llm','gpt']},
      {name:'Software',icon:'💻',k:['software engineer','developer','backend','frontend','fullstack','devops']},
      {name:'Data',icon:'📊',k:['data analyst','database','dba']},
      {name:'Security',icon:'🔒',k:['security','secops','infosec']},
      {name:'Product',icon:'📦',k:['product manager','pm','designer','ux']},
      {name:'Cloud',icon:'☁️',k:['cloud','aws','azure','gcp','kubernetes']}
    ];
    
    function categorizeJob(title) {
      var t = (title || '').toLowerCase();
      for(var i=0; i<CATEGORIES.length; i++) {
        var cat = CATEGORIES[i];
        for(var j=0; j<cat.k.length; j++) {
          if(t.indexOf(cat.k[j]) >= 0) return cat.name;
        }
      }
      return 'Other';
    }
    
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('tab-' + tab).classList.add('active');
      
      var isStories = (tab === 'stories');
      document.getElementById('stories-controls').classList.toggle('hidden', !isStories);
      document.getElementById('jobs-controls').classList.toggle('hidden', isStories);
      document.getElementById('stories-stats').classList.toggle('hidden', !isStories);
      document.getElementById('jobs-stats').classList.toggle('hidden', isStories);
      document.getElementById('job-categories').classList.toggle('hidden', isStories);
      document.getElementById('job-chart').classList.toggle('hidden', isStories);
      document.getElementById('stories').classList.toggle('hidden', !isStories);
      document.getElementById('jobs').classList.toggle('hidden', isStories);
      
      if(tab === 'stories') { loadStories(); } 
      else { loadJobs(); loadJobHistory(); }
    }
    
    function loadDates() {
      fetch('/api/hn-dates').then(function(r) { return r.json(); }).then(function(data) {
        var sel = document.getElementById('dateSelect');
        sel.innerHTML = '<option value="">Today</option>';
        data.dates.forEach(function(d) { sel.innerHTML += '<option value="'+d+'">'+d+'</option>'; });
      });
    }
    
    function saveToday() {
      fetch('/api/hn-stories?date=today').then(function(r) { return r.json(); }).then(function(data) {
        if(data.date) { loadDates(); document.getElementById('dateSelect').value = data.date; alert('Saved: '+data.date); }
      });
    }
    
    function loadStories() {
      var d = document.getElementById('dateSelect').value;
      var url = d ? '/api/hn-stories?date='+d : '/api/hn-stories';
      document.getElementById('stories').innerHTML = '<div class="loading">Loading...</div>';
      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        stories = data.stories || [];
        stories.sort(function(a,b) { return (b.score||0) - (a.score||0); });
        renderStories();
        var ts = stories.reduce(function(s,x){return s+(x.score||0);},0);
        var tc = stories.reduce(function(s,x){return s+(x.descendants||0);},0);
        document.getElementById('totalScore').textContent = ts;
        document.getElementById('totalComments').textContent = tc;
      });
    }
    
    function loadJobs() {
      document.getElementById('jobs').innerHTML = '<div class="loading">Loading...</div>';
      fetch('/api/hn-jobs').then(function(r) { return r.json(); }).then(function(data) {
        jobs = data.jobs || [];
        document.getElementById('totalJobs').textContent = jobs.length;
        renderJobCategories();
        renderJobs();
      });
    }
    
    function loadJobHistory() {
      fetch('/api/hn-jobs-history').then(function(r) { return r.json(); }).then(function(data) {
        renderJobChart(data.history || []);
      });
    }
    
    function renderJobCategories() {
      var cnt = {};
      CATEGORIES.forEach(function(c) { cnt[c.name] = 0; });
      cnt['Other'] = 0;
      jobs.forEach(function(j) { cnt[categorizeJob(j.title)] = (cnt[categorizeJob(j.title)] || 0) + 1; });
      var cats = CATEGORIES.filter(function(c) { return cnt[c.name] > 0; });
      if(cnt['Other'] > 0) cats.push({name:'Other', icon:'📋'});
      
      // Add "All" category
      var allHtml = '<div class="category-card'+(activeCategory===null?' active':'')+'" onclick="filterByCategory(null)"><span class="cat-icon">📋</span><span class="cat-count">'+jobs.length+'</span><span class="cat-name">All</span></div>';
      
      document.getElementById('job-categories').innerHTML = allHtml + cats.map(function(c) {
        return '<div class="category-card'+(activeCategory===c.name?' active':'')+'" onclick="filterByCategory(\''+c.name+'\')"><span class="cat-icon">'+c.icon+'</span><span class="cat-count">'+cnt[c.name]+'</span><span class="cat-name">'+c.name+'</span></div>';
      }).join('');
    }
    
    function filterByCategory(cat) {
      activeCategory = cat;
      renderJobCategories();
      renderJobs();
    }
    
    function renderJobChart(h) {
      if(!h.length) { document.getElementById('chart-bars').innerHTML = '<div class="no-data">No history</div>'; return; }
      var max = Math.max.apply(null, h.map(function(x) { return x.count; }));
      document.getElementById('chart-bars').innerHTML = h.map(function(x) {
        return '<div class="chart-bar" style="height:'+(x.count/max*100)+'%"></div>';
      }).join('');
      document.getElementById('chart-labels').innerHTML = h.map(function(x) {
        return '<span>'+new Date(x.date).toLocaleDateString('en-US',{weekday:'short'})+'</span>';
      }).join('');
    }
    
    function renderJobs() {
      var c = document.getElementById('jobs');
      var filtered = activeCategory ? jobs.filter(function(j) { return categorizeJob(j.title) === activeCategory; }) : jobs;
      if(filtered.length === 0) { c.innerHTML = '<div class="no-data">No jobs</div>'; return; }
      var html = '';
      for(var i=0; i<filtered.length; i++) {
        var j = filtered[i];
        var cat = categorizeJob(j.title);
        html += '<div class="story"><div class="story-header"><span class="rank">#'+(i+1)+'</span><span class="job-category">'+cat+'</span></div>';
        html += '<a class="title" href="'+(j.url || 'https://news.ycombinator.com/item?id='+j.id)+'" target="_blank">'+esc(j.title)+'</a>';
        html += '<div class="meta">by '+esc(j.by)+' • '+fmt(j.time);
        if(j.url) html += ' <span class="domain">'+getDom(j.url)+'</span>';
        html += '</div></div>';
      }
      c.innerHTML = html;
    }
    
    function renderStories() {
      var c = document.getElementById('stories');
      if(stories.length === 0) { c.innerHTML = '<div class="no-data">No stories</div>'; return; }
      var html = '';
      for(var i=0; i<stories.length; i++) {
        var s = stories[i];
        html += '<div class="story"><div class="story-header"><span class="rank">#'+(i+1)+'</span><span class="score">'+(s.score||0)+' pts</span></div>';
        html += '<a class="title" href="'+(s.url || 'https://news.ycombinator.com/item?id='+s.id)+'" target="_blank">'+esc(s.title)+'</a>';
        html += '<div class="meta">by '+esc(s.by)+' • '+fmt(s.time);
        if(s.url) html += ' <span class="domain">'+getDom(s.url)+'</span>';
        html += ' <a class="comments-link" href="https://news.ycombinator.com/item?id='+s.id+'" target="_blank">'+(s.descendants||0)+' comments</a>';
        html += '</div></div>';
      }
      c.innerHTML = html;
    }
    
    function fmt(t) {
      var d = Math.floor((Date.now()/1000 - t) / 1000);
      if(d < 3600) return Math.floor(d/60) + 'm ago';
      if(d < 86400) return Math.floor(d/3600) + 'h ago';
      return Math.floor(d/86400) + 'd ago';
    }
    
    function getDom(url) {
      try { return new URL(url).hostname.replace('www.',''); } catch(e) { return ''; }
    }
    
    function esc(text) {
      var div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
    
    loadDates();
    loadStories();
  </script>
</body>
</html>
